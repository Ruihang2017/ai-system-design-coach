questions:
  # ─────────────────────────────────────────────────────────────────────────────
  # DEFINITION  (20 questions)
  # ─────────────────────────────────────────────────────────────────────────────
  - id: q001
    type: definition
    question: "What is retrieval-augmented generation (RAG)?"
    should_refuse: false
    required_sources:
      - https://en.wikipedia.org/wiki/Retrieval-augmented_generation
      - https://aws.amazon.com/what-is/retrieval-augmented-generation/
    expected_points:
      - "combines a retriever with a generative language model"
      - "grounds answers in retrieved external documents"
      - "reduces hallucinations by conditioning on retrieved context"

  - id: q002
    type: definition
    question: "What is a vector database, and how does it differ from a traditional relational database?"
    should_refuse: false
    required_sources:
      - https://en.wikipedia.org/wiki/Vector_database
    expected_points:
      - "stores high-dimensional vectors (embeddings)"
      - "supports approximate nearest neighbor (ANN) search"
      - "optimized for similarity search rather than exact match queries"

  - id: q003
    type: definition
    question: "What are word embeddings and what do they represent?"
    should_refuse: false
    required_sources:
      - https://en.wikipedia.org/wiki/Word_embedding
    expected_points:
      - "dense numerical vector representations of words"
      - "capture semantic relationships between words"
      - "words with similar meanings have nearby vectors"

  - id: q004
    type: definition
    question: "What is a text splitter (chunker) in a RAG pipeline and why is it needed?"
    should_refuse: false
    required_sources:
      - https://python.langchain.com/docs/concepts/text_splitters/
    expected_points:
      - "divides large documents into smaller pieces (chunks)"
      - "allows content to fit within embedding model and LLM context windows"
      - "chunk size and overlap affect retrieval quality"

  - id: q005
    type: definition
    question: "What is hybrid search in the context of vector retrieval?"
    should_refuse: false
    required_sources:
      - https://qdrant.tech/articles/hybrid-search/
    expected_points:
      - "combines dense vector search with sparse (keyword) search"
      - "improves recall over dense-only or keyword-only retrieval"
      - "fusion step (e.g., RRF) merges the two ranked lists"

  - id: q006
    type: definition
    question: "What does Qdrant offer as a vector database?"
    should_refuse: false
    required_sources:
      - https://qdrant.tech/documentation/overview/
    expected_points:
      - "vector similarity search engine"
      - "stores payload (metadata) alongside vectors"
      - "provides filtering on metadata during search"

  - id: q007
    type: definition
    question: "What is RAGAS and what does it evaluate in a RAG system?"
    should_refuse: false
    required_sources:
      - https://raw.githubusercontent.com/explodinggradients/ragas/main/README.md
    expected_points:
      - "framework for evaluating RAG pipelines"
      - "measures faithfulness, answer relevancy, context recall"
      - "provides automated LLM-based scoring metrics"

  - id: q008
    type: definition
    question: "What is a Docker container and how does it differ from a virtual machine?"
    should_refuse: false
    required_sources:
      - https://docs.docker.com/get-started/docker-overview/
    expected_points:
      - "lightweight isolated environment sharing the host OS kernel"
      - "packages application code with its dependencies into an image"
      - "faster startup and lower overhead than a full VM"

  - id: q009
    type: definition
    question: "What is a Docker image in the context of containerization?"
    should_refuse: false
    required_sources:
      - https://docs.docker.com/get-started/docker-overview/
    expected_points:
      - "read-only template used to create containers"
      - "composed of layered filesystem snapshots"
      - "built from a Dockerfile"

  - id: q010
    type: definition
    question: "What is approximate nearest neighbor (ANN) search and why is it used in vector databases?"
    should_refuse: false
    required_sources:
      - https://qdrant.tech/documentation/concepts/search/
      - https://en.wikipedia.org/wiki/Vector_database
    expected_points:
      - "finds vectors close to a query vector without exhaustive scan"
      - "trades small accuracy loss for large speed gains"
      - "enables scalable similarity search over millions of vectors"

  - id: q011
    type: definition
    question: "What is observability in software systems, and what are its three main pillars?"
    should_refuse: false
    required_sources:
      - https://opentelemetry.io/docs/concepts/observability-primer/
    expected_points:
      - "ability to understand internal state from external outputs"
      - "three pillars: logs, metrics, and traces"
      - "enables debugging distributed systems without changing code"

  - id: q012
    type: definition
    question: "What is a trace in OpenTelemetry observability?"
    should_refuse: false
    required_sources:
      - https://opentelemetry.io/docs/concepts/observability-primer/
    expected_points:
      - "records the path of a request through distributed services"
      - "composed of spans linked by a trace ID"
      - "shows latency and errors across service boundaries"

  - id: q013
    type: definition
    question: "What is the role of the retriever component in a RAG system?"
    should_refuse: false
    required_sources:
      - https://python.langchain.com/docs/concepts/rag/
    expected_points:
      - "fetches relevant documents or chunks from a knowledge store"
      - "uses similarity search on query embeddings"
      - "provides context to the language model for generation"

  - id: q014
    type: definition
    question: "What is LangGraph and what problem does it solve for AI agent development?"
    should_refuse: false
    required_sources:
      - https://langchain-ai.github.io/langgraph/concepts/why-langgraph/
    expected_points:
      - "framework for building stateful multi-step agent workflows"
      - "models computation as a graph of nodes and edges"
      - "provides explicit control flow and state management for agents"

  - id: q015
    type: definition
    question: "What is async I/O in Python web frameworks and why is it beneficial for LLM-backed APIs?"
    should_refuse: false
    required_sources:
      - https://fastapi.tiangolo.com/async/
    expected_points:
      - "allows handling multiple requests concurrently without threads"
      - "avoids blocking the event loop during network I/O"
      - "improves throughput when waiting for slow LLM API calls"

  - id: q016
    type: definition
    question: "What is the indexing stage in a RAG pipeline?"
    should_refuse: false
    required_sources:
      - https://python.langchain.com/docs/tutorials/rag/
    expected_points:
      - "converts documents into embeddings and stores them in a vector store"
      - "involves loading, splitting, embedding, and persisting chunks"
      - "done offline before query time"

  - id: q017
    type: definition
    question: "What does Redis offer as a vector database?"
    should_refuse: false
    required_sources:
      - https://redis.io/docs/latest/develop/get-started/vector-database/
    expected_points:
      - "stores vectors alongside other data types in Redis"
      - "supports vector similarity search with HNSW or flat indexing"
      - "enables low-latency retrieval for AI applications"

  - id: q018
    type: definition
    question: "What is faithfulness as a RAGAS evaluation metric?"
    should_refuse: false
    required_sources:
      - https://raw.githubusercontent.com/explodinggradients/ragas/main/README.md
    expected_points:
      - "measures whether the generated answer is supported by the retrieved context"
      - "detects hallucination by checking factual consistency"
      - "score between 0 and 1"

  - id: q019
    type: definition
    question: "What is a span in OpenTelemetry, and how does it relate to a trace?"
    should_refuse: false
    required_sources:
      - https://opentelemetry.io/docs/concepts/observability-primer/
    expected_points:
      - "unit of work representing a single operation with start and end times"
      - "spans are nested inside a trace"
      - "carries attributes like HTTP status, service name, and duration"

  - id: q020
    type: definition
    question: "What is the generation step in a RAG pipeline responsible for?"
    should_refuse: false
    required_sources:
      - https://python.langchain.com/docs/concepts/rag/
    expected_points:
      - "produces a natural language answer using the retrieved context"
      - "conditions the LLM on the retrieved documents as additional context"
      - "formats retrieved chunks into a prompt for the language model"

  # ─────────────────────────────────────────────────────────────────────────────
  # COMPARISON  (15 questions)
  # ─────────────────────────────────────────────────────────────────────────────
  - id: q021
    type: comparison
    question: "How does dense vector search differ from sparse (BM25/keyword) search in terms of retrieval mechanism?"
    should_refuse: false
    required_sources:
      - https://qdrant.tech/articles/hybrid-search/
    expected_points:
      - "dense search uses embedding similarity; sparse uses term frequency matching"
      - "dense handles semantic synonyms better; sparse is exact-term precise"
      - "hybrid search combines both to leverage their complementary strengths"

  - id: q022
    type: comparison
    question: "What are the trade-offs between smaller and larger chunk sizes when splitting documents for RAG?"
    should_refuse: false
    required_sources:
      - https://python.langchain.com/docs/concepts/text_splitters/
    expected_points:
      - "smaller chunks increase retrieval precision but may lose context"
      - "larger chunks provide more context but reduce retrieval specificity"
      - "chunk overlap helps preserve continuity at boundaries"

  - id: q023
    type: comparison
    question: "How does Qdrant compare to Redis as a vector database for production AI workloads?"
    should_refuse: false
    required_sources:
      - https://qdrant.tech/documentation/overview/
      - https://redis.io/docs/latest/develop/get-started/vector-database/
    expected_points:
      - "Qdrant is purpose-built for vector search with rich filtering"
      - "Redis adds vector search to a general-purpose data store"
      - "both support ANN indexing but with different architectural tradeoffs"

  - id: q024
    type: comparison
    question: "How does Reciprocal Rank Fusion (RRF) compare to score-based fusion when combining dense and sparse search results?"
    should_refuse: false
    required_sources:
      - https://qdrant.tech/articles/hybrid-search/
    expected_points:
      - "RRF uses rank positions rather than raw scores, making it score-agnostic"
      - "score fusion requires compatible score scales across retrievers"
      - "RRF is simpler to tune and generally robust across domains"

  - id: q025
    type: comparison
    question: "What is the difference between synchronous and asynchronous request handling in a FastAPI application?"
    should_refuse: false
    required_sources:
      - https://fastapi.tiangolo.com/async/
    expected_points:
      - "sync handlers block the thread; async handlers yield control during I/O waits"
      - "async allows higher concurrency with fewer threads"
      - "use async def for I/O-bound endpoints like LLM API calls"

  - id: q026
    type: comparison
    question: "How does LangGraph differ from a simple LangChain chain for building multi-step AI workflows?"
    should_refuse: false
    required_sources:
      - https://langchain-ai.github.io/langgraph/concepts/why-langgraph/
    expected_points:
      - "LangGraph supports cycles and loops; chains are linear"
      - "LangGraph has explicit state management across steps"
      - "LangGraph enables conditional branching based on agent decisions"

  - id: q027
    type: comparison
    question: "How do Docker containers differ from Docker images?"
    should_refuse: false
    required_sources:
      - https://docs.docker.com/get-started/docker-overview/
    expected_points:
      - "images are read-only templates; containers are running instances of images"
      - "multiple containers can be created from one image"
      - "containers add a writable layer on top of the image"

  - id: q028
    type: comparison
    question: "How does answer relevancy differ from faithfulness as RAGAS evaluation metrics?"
    should_refuse: false
    required_sources:
      - https://raw.githubusercontent.com/explodinggradients/ragas/main/README.md
    expected_points:
      - "answer relevancy measures how well the answer addresses the question"
      - "faithfulness measures factual consistency with the retrieved context"
      - "a faithful answer may still be irrelevant to the question"

  - id: q029
    type: comparison
    question: "How does HNSW (Hierarchical Navigable Small World) indexing compare to a flat (brute-force) vector index?"
    should_refuse: false
    required_sources:
      - https://qdrant.tech/documentation/concepts/search/
    expected_points:
      - "HNSW is an ANN index that trades recall for much faster query speed"
      - "flat index computes exact distances but scales poorly for large datasets"
      - "HNSW uses a graph structure to navigate to approximate nearest neighbors"

  - id: q030
    type: comparison
    question: "What are the differences between logs, metrics, and traces as observability signals?"
    should_refuse: false
    required_sources:
      - https://opentelemetry.io/docs/concepts/observability-primer/
    expected_points:
      - "logs are timestamped text records of discrete events"
      - "metrics are numeric aggregates measured over time"
      - "traces show the flow and timing of a request across services"

  - id: q031
    type: comparison
    question: "How does the RAG approach to knowledge grounding compare to fine-tuning a language model on domain data?"
    should_refuse: false
    required_sources:
      - https://aws.amazon.com/what-is/retrieval-augmented-generation/
      - https://en.wikipedia.org/wiki/Retrieval-augmented_generation
    expected_points:
      - "RAG retrieves external knowledge at query time without modifying model weights"
      - "fine-tuning bakes knowledge into model parameters requiring retraining for updates"
      - "RAG allows fresher knowledge updates by changing the document store"

  - id: q032
    type: comparison
    question: "How do word2vec embeddings compare to contextual embeddings (e.g., from transformer models) in terms of representing word meaning?"
    should_refuse: false
    required_sources:
      - https://en.wikipedia.org/wiki/Word_embedding
    expected_points:
      - "word2vec assigns one static vector per word regardless of context"
      - "contextual embeddings vary by sentence context for polysemous words"
      - "transformer-based embeddings generally outperform static embeddings on downstream tasks"

  - id: q033
    type: comparison
    question: "How does the FastAPI path operation decorator approach compare to manually registering routes in a web framework?"
    should_refuse: false
    required_sources:
      - https://fastapi.tiangolo.com/tutorial/first-steps/
    expected_points:
      - "decorators like @app.get() provide concise declarative route registration"
      - "FastAPI automatically generates OpenAPI docs from decorated functions"
      - "type hints on parameters drive both validation and documentation"

  - id: q034
    type: comparison
    question: "What are the trade-offs between using a cosine similarity metric versus Euclidean distance for vector search?"
    should_refuse: false
    required_sources:
      - https://qdrant.tech/documentation/concepts/search/
    expected_points:
      - "cosine similarity measures angle between vectors, ignoring magnitude"
      - "Euclidean distance is sensitive to vector magnitude differences"
      - "cosine is preferred for text embeddings where direction matters more than length"

  - id: q035
    type: comparison
    question: "How does the indexing stage differ from the query (retrieval + generation) stage in a RAG pipeline?"
    should_refuse: false
    required_sources:
      - https://python.langchain.com/docs/tutorials/rag/
    expected_points:
      - "indexing is an offline preprocessing step that builds the vector store"
      - "the query stage runs in real time to answer user questions"
      - "indexing is typically run once or on update; querying happens per request"

  # ─────────────────────────────────────────────────────────────────────────────
  # ARCHITECTURE  (15 questions)
  # ─────────────────────────────────────────────────────────────────────────────
  - id: q036
    type: architecture
    question: "Describe the end-to-end architecture of a basic RAG pipeline from document ingestion to answer generation."
    should_refuse: false
    required_sources:
      - https://python.langchain.com/docs/tutorials/rag/
      - https://python.langchain.com/docs/concepts/rag/
    expected_points:
      - "load documents, split into chunks, embed chunks, store in vector DB"
      - "at query time: embed query, retrieve top-k chunks, pass to LLM with prompt"
      - "LLM generates grounded answer citing retrieved context"

  - id: q037
    type: architecture
    question: "How would you architect a hybrid search system using both dense and sparse retrievers?"
    should_refuse: false
    required_sources:
      - https://qdrant.tech/articles/hybrid-search/
    expected_points:
      - "run dense embedding search and sparse BM25/keyword search in parallel"
      - "fuse ranked result lists using RRF or score normalization"
      - "Qdrant supports storing both dense and sparse vectors per point"

  - id: q038
    type: architecture
    question: "How should you design a FastAPI service to handle high-concurrency LLM inference requests?"
    should_refuse: false
    required_sources:
      - https://fastapi.tiangolo.com/async/
    expected_points:
      - "use async def endpoints to avoid blocking the event loop"
      - "leverage async HTTP clients for LLM API calls"
      - "multiple requests are handled concurrently within a single process"

  - id: q039
    type: architecture
    question: "What components are needed to add observability to a RAG service using OpenTelemetry?"
    should_refuse: false
    required_sources:
      - https://opentelemetry.io/docs/concepts/observability-primer/
    expected_points:
      - "instrument code to emit traces (spans) for retrieval and generation steps"
      - "export metrics for latency, token usage, and error rates"
      - "send telemetry to a backend like Jaeger or Prometheus via OTLP"

  - id: q040
    type: architecture
    question: "How would you containerize a RAG backend service using Docker for repeatable deployments?"
    should_refuse: false
    required_sources:
      - https://docs.docker.com/get-started/docker-overview/
    expected_points:
      - "write a Dockerfile that packages the application and dependencies into an image"
      - "build an image with docker build; run containers with docker run"
      - "use Docker Compose or container orchestration to manage multi-service stacks"

  - id: q041
    type: architecture
    question: "How would you design a multi-hop reasoning agent using LangGraph for a complex research task?"
    should_refuse: false
    required_sources:
      - https://langchain-ai.github.io/langgraph/concepts/why-langgraph/
    expected_points:
      - "model the agent as a graph with nodes for retrieval, reasoning, and synthesis"
      - "use edges with conditions to loop back for additional retrieval steps"
      - "persist intermediate state so each node can access prior results"

  - id: q042
    type: architecture
    question: "What is the role of a document loader in a LangChain RAG pipeline and how does it connect to the rest of the system?"
    should_refuse: false
    required_sources:
      - https://python.langchain.com/docs/tutorials/rag/
    expected_points:
      - "fetches raw content from sources (files, URLs, databases)"
      - "outputs Document objects passed to a text splitter"
      - "sits at the start of the ingestion pipeline before chunking and embedding"

  - id: q043
    type: architecture
    question: "Describe how Qdrant's collection and point architecture organizes vector data."
    should_refuse: false
    required_sources:
      - https://qdrant.tech/documentation/overview/
    expected_points:
      - "collection is the top-level namespace grouping related vectors"
      - "each point contains a vector, an id, and optional payload metadata"
      - "payload fields can be indexed for filtered similarity search"

  - id: q044
    type: architecture
    question: "How would you use Redis as a vector store in a production RAG application?"
    should_refuse: false
    required_sources:
      - https://redis.io/docs/latest/develop/get-started/vector-database/
    expected_points:
      - "store embedding vectors in Redis using HSET with vector fields"
      - "create a vector index with HNSW or flat algorithm using FT.CREATE"
      - "query using FT.SEARCH with KNN syntax for approximate nearest neighbor retrieval"

  - id: q045
    type: architecture
    question: "How should an evaluation harness be structured to measure RAG pipeline quality using RAGAS metrics?"
    should_refuse: false
    required_sources:
      - https://raw.githubusercontent.com/explodinggradients/ragas/main/README.md
    expected_points:
      - "collect (question, ground truth, generated answer, retrieved contexts) tuples"
      - "compute faithfulness, answer relevancy, context recall, and context precision"
      - "run evaluation over a golden dataset to track quality over time"

  - id: q046
    type: architecture
    question: "What chunking strategy should be used for documents with well-defined structural boundaries, such as markdown or code files?"
    should_refuse: false
    required_sources:
      - https://python.langchain.com/docs/concepts/text_splitters/
    expected_points:
      - "use structure-aware splitters that respect headers, sections, or code blocks"
      - "recursive character text splitter tries multiple separators in order of preference"
      - "preserving semantic units prevents splitting answers across chunk boundaries"

  - id: q047
    type: architecture
    question: "How would you design a self-correcting RAG loop where the system checks retrieval quality before generating an answer?"
    should_refuse: false
    required_sources:
      - https://langchain-ai.github.io/langgraph/concepts/why-langgraph/
    expected_points:
      - "add a grading node that scores retrieved document relevance"
      - "use a conditional edge to re-retrieve or rewrite the query if relevance is low"
      - "LangGraph cycles enable this kind of iterative refinement"

  - id: q048
    type: architecture
    question: "Describe the embedding pipeline: from raw text input to a stored vector ready for similarity search."
    should_refuse: false
    required_sources:
      - https://qdrant.tech/articles/what-are-embeddings/
    expected_points:
      - "text is tokenized and passed through an embedding model (e.g., sentence-transformers)"
      - "model outputs a dense floating-point vector of fixed dimensionality"
      - "vector is stored in a vector database with an ID and optional metadata"

  - id: q049
    type: architecture
    question: "What architectural decisions are needed to make a RAG service stateless so it can scale horizontally?"
    should_refuse: false
    required_sources:
      - https://fastapi.tiangolo.com/async/
      - https://docs.docker.com/get-started/docker-overview/
    expected_points:
      - "keep no per-request state in the application server process"
      - "externalize the vector store and any caches (e.g., Redis) as shared services"
      - "run multiple container replicas behind a load balancer"

  - id: q050
    type: architecture
    question: "How does a LangGraph state machine enable agent memory across multiple turns in a conversation?"
    should_refuse: false
    required_sources:
      - https://langchain-ai.github.io/langgraph/concepts/why-langgraph/
    expected_points:
      - "graph state is a typed dictionary shared and updated by each node"
      - "past messages or retrieved documents can be accumulated in state"
      - "checkpointing the state enables resumable, persistent conversations"

  # ─────────────────────────────────────────────────────────────────────────────
  # TROUBLESHOOTING  (15 questions)
  # ─────────────────────────────────────────────────────────────────────────────
  - id: q051
    type: troubleshooting
    question: "Your RAG system is returning answers that contradict the source documents. What are likely causes and how would you diagnose them?"
    should_refuse: false
    required_sources:
      - https://python.langchain.com/docs/concepts/rag/
      - https://raw.githubusercontent.com/explodinggradients/ragas/main/README.md
    expected_points:
      - "check faithfulness score; low score indicates the LLM is hallucinating outside context"
      - "verify retrieval is returning the relevant chunks for the question"
      - "inspect the prompt template to ensure context is correctly injected"

  - id: q052
    type: troubleshooting
    question: "Retrieval precision is low: many irrelevant chunks are being returned. What steps would you take to improve it?"
    should_refuse: false
    required_sources:
      - https://qdrant.tech/documentation/concepts/search/
    expected_points:
      - "raise the similarity score threshold to filter out low-confidence results"
      - "reduce top-k to return fewer but more relevant results"
      - "review embedding model quality and chunk size settings"

  - id: q053
    type: troubleshooting
    question: "A FastAPI endpoint that calls an LLM API is very slow under load. How would you investigate and fix this?"
    should_refuse: false
    required_sources:
      - https://fastapi.tiangolo.com/async/
    expected_points:
      - "ensure the endpoint uses async def and an async HTTP client"
      - "check whether a synchronous blocking call is inside an async handler"
      - "use concurrency profiling to confirm event loop is not being blocked"

  - id: q054
    type: troubleshooting
    question: "Your RAGAS context recall score is very low. What does this indicate and how would you address it?"
    should_refuse: false
    required_sources:
      - https://raw.githubusercontent.com/explodinggradients/ragas/main/README.md
    expected_points:
      - "context recall measures whether ground-truth information appears in retrieved chunks"
      - "low score means relevant documents are not being retrieved"
      - "increase top-k, improve embedding model, or add hybrid search"

  - id: q055
    type: troubleshooting
    question: "Qdrant search is returning no results even though the collection has data. What would you check?"
    should_refuse: false
    required_sources:
      - https://qdrant.tech/documentation/concepts/search/
    expected_points:
      - "verify the query vector dimension matches the collection's vector configuration"
      - "check if a payload filter is excluding all points"
      - "confirm the collection name and that it has been populated with points"

  - id: q056
    type: troubleshooting
    question: "Your Docker container starts but the FastAPI application crashes immediately. How would you diagnose the issue?"
    should_refuse: false
    required_sources:
      - https://docs.docker.com/get-started/docker-overview/
    expected_points:
      - "inspect container logs with docker logs to see the startup traceback"
      - "check that environment variables (API keys, ports) are correctly passed"
      - "run the container interactively to debug inside the container environment"

  - id: q057
    type: troubleshooting
    question: "Text chunks are being split in the middle of sentences, causing poor retrieval quality. What should you change?"
    should_refuse: false
    required_sources:
      - https://python.langchain.com/docs/concepts/text_splitters/
    expected_points:
      - "use a sentence-aware splitter (e.g., recursive character splitter with sentence separators)"
      - "add chunk overlap to preserve context at boundaries"
      - "adjust chunk size to align with sentence or paragraph boundaries"

  - id: q058
    type: troubleshooting
    question: "Your RAG system answers questions about topics that should cause it to refuse, but it generates an answer anyway. What is wrong and how do you fix it?"
    should_refuse: false
    required_sources:
      - https://python.langchain.com/docs/concepts/rag/
    expected_points:
      - "the LLM prompt lacks a clear instruction to decline out-of-scope questions"
      - "add an explicit refusal instruction when no relevant context is retrieved"
      - "check retrieval: if irrelevant chunks are returned, the LLM may confabulate"

  - id: q059
    type: troubleshooting
    question: "OpenTelemetry traces show a very high latency spike in the retrieval span. What would you investigate?"
    should_refuse: false
    required_sources:
